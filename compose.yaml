name: kahis-batch-monitor
services:
  postgres:
    container_name: "kahis-batch-monitor-postgres"
    image: 'postgres:latest'
    environment:
      - 'POSTGRES_DB=postgres'
      - 'POSTGRES_PASSWORD=postgres'
      - 'POSTGRES_USER=postgres'
    ports:
      - '5432:5432'
    volumes:
      # 첫 컨테이너 기동 시 자동 실행: batch_monitor 스키마 생성
      - ./scripts/local/postgres-init.sql:/docker-entrypoint-initdb.d/01-init.sql:ro

  oracle:
    container_name: "kahis-batch-monitor-oracle"
    image: 'gvenzl/oracle-free:latest'
    volumes:
      - oracle:/opt/oracle/oradata
      # 수동 실행용 init 스크립트 (docker exec로 한 번 실행)
      - ./scripts/local:/scripts:ro
    environment:
      ORACLE_DATABASE: m2msys
      ORACLE_PASSWORD: m2msys
      APP_USER: m2msys
      APP_USER_PASSWORD: m2msys
    ports:
      - "1521:1521"
    healthcheck:
      test: [ "CMD", "healthcheck.sh" ]
      interval: 10s
      timeout: 5s
      retries: 10
      start_period: 5s
      start_interval: 5s
    networks:
      - bridge

  kafka-first:
    image: apache/kafka:latest
    container_name: kafka-first
    networks:
      - kafka-net
    ports:
      - '9092:9092'
    environment:
      - KAFKA_NODE_ID=1
      - KAFKA_PROCESS_ROLES=controller,broker
      - KAFKA_LISTENERS=PLAINTEXT://:9092,CONTROLLER://:9093
      - KAFKA_LISTENER_SECURITY_PROTOCOL_MAP=CONTROLLER:PLAINTEXT,PLAINTEXT:PLAINTEXT
      - KAFKA_CONTROLLER_QUORUM_VOTERS=1@kafka-first:9093,2@kafka-second:9093,3@kafka-third:9093
      - KAFKA_CONTROLLER_LISTENER_NAMES=CONTROLLER
      - KAFKA_INTER_BROKER_LISTENER_NAME=PLAINTEXT
      - KAFKA_ADVERTISED_LISTENERS=PLAINTEXT://localhost:9092
      - CLUSTER_ID=R3oO2r6YKAZDxCTi2K9j3w
    volumes:
      - kafka-first-data:/var/lib/kafka/data

  kafka-second:
    image: apache/kafka:latest
    container_name: kafka-second
    networks:
      - kafka-net
    ports:
      - '9094:9094'
    environment:
      - KAFKA_NODE_ID=2
      - KAFKA_PROCESS_ROLES=controller,broker
      - KAFKA_LISTENERS=PLAINTEXT://:9094,CONTROLLER://:9093
      - KAFKA_LISTENER_SECURITY_PROTOCOL_MAP=CONTROLLER:PLAINTEXT,PLAINTEXT:PLAINTEXT
      - KAFKA_CONTROLLER_QUORUM_VOTERS=1@kafka-first:9093,2@kafka-second:9093,3@kafka-third:9093
      - KAFKA_CONTROLLER_LISTENER_NAMES=CONTROLLER
      - KAFKA_INTER_BROKER_LISTENER_NAME=PLAINTEXT
      - KAFKA_ADVERTISED_LISTENERS=PLAINTEXT://localhost:9094
      - CLUSTER_ID=R3oO2r6YKAZDxCTi2K9j3w
    volumes:
      - kafka-second-data:/var/lib/kafka/data

  kafka-third:
    image: apache/kafka:latest
    container_name: kafka-third
    networks:
      - kafka-net
    ports:
      - '9096:9096'
    environment:
      - KAFKA_NODE_ID=3
      - KAFKA_PROCESS_ROLES=controller,broker
      - KAFKA_LISTENERS=PLAINTEXT://:9096,CONTROLLER://:9093
      - KAFKA_LISTENER_SECURITY_PROTOCOL_MAP=CONTROLLER:PLAINTEXT,PLAINTEXT:PLAINTEXT
      - KAFKA_CONTROLLER_QUORUM_VOTERS=1@kafka-first:9093,2@kafka-second:9093,3@kafka-third:9093
      - KAFKA_CONTROLLER_LISTENER_NAMES=CONTROLLER
      - KAFKA_INTER_BROKER_LISTENER_NAME=PLAINTEXT
      - KAFKA_ADVERTISED_LISTENERS=PLAINTEXT://localhost:9096
      - CLUSTER_ID=R3oO2r6YKAZDxCTi2K9j3w
    volumes:
      - kafka-third-data:/var/lib/kafka/data

networks:
  kafka-net:
    driver: bridge
  bridge:
    driver: bridge

volumes:
  kafka-first-data:
  kafka-second-data:
  kafka-third-data:
  oracle: