spring:
  profiles:
    active: dev
  application:
    name: kahis-batch-monitor

  jackson:
    property-naming-strategy: SNAKE_CASE
    date-format: yyyy-MM-dd HH:mm:ss

  cloud:
    openfeign:
      client:
        config:
          airflowClient:
            connectTimeout: 5000
            readTimeout: 5000
            loggerLevel: full

airflow:
  api:
    url: http://localhost:8080/api/v1
    username: ${AIRFLOW_USER:admin}
    password: ${AIRFLOW_PWD:admin}